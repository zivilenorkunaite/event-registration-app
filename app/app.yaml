command:
  - "uvicorn"
  - "backend.main:app"
  - "--app-dir"
  - "."
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: "app-warehouse"
  - name: DATABRICKS_CATALOG
    value: 'main'
  - name: DATABRICKS_SCHEMA
    value: 'default'
  - name: DATABRICKS_VOLUME_PATH
    valueFrom: "app-volume"
  - name: EVENT_NAME
    value: 'Energy & Utilities Data Connect'
  - name: EVENT_LOCATION
    value: 'Sydney'
  - name: LOCAL_AGENT_QUEUE_TABLE
    value: 'main.default.print_jobs'
  - name: REGISTRATIONS_TABLE
    value: 'main.default.event_registrations'
  - name: PORT
    value: "8000"
  - name: NIIMBOT_LABEL_WIDTH_MM
    value: "50"
  - name: NIIMBOT_LABEL_HEIGHT_MM
    value: "80"
  - name: NIIMBOT_ROTATE_TEXT_90
    value: "true"
  - name: NIIMBOT_ROTATE_PORTRAIT
    value: "false"
  - name: NIIMBOT_PRINT_TASK
    value: "B1"
  - name: NIIMBOT_PRINT_DIRECTION
    value: "top"
  - name: NIIMBOT_IMAGE_FIT
    value: "contain"
  - name: NIIMBOT_IMAGE_POSITION
    value: "centre"
