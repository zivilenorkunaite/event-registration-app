<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin · Attendees</title>
    <style>
      :root {
        --brand-navy: #1a3a5c;
        --brand-navy-dark: #112640;
        --brand-amber: #e87722;
        --brand-amber-hover: #d0681a;
        --brand-bg: #f0f3f7;
        --brand-card: #ffffff;
        --brand-border: #dce3ec;
        --brand-text: #1a2a3a;
        --brand-muted: #6b7a8d;
        --brand-label: #374a5e;
        --brand-th-bg: #f4f7fa;
        --brand-row-hover: #f8fafc;
        --brand-success-bg: #eaf7ec;
        --brand-success-text: #1a6b2e;
        --brand-error-bg: #fef2f2;
        --brand-error-text: #b91c1c;
        --brand-input-bg: #f7f9fc;
        --brand-input-border: #c8d3df;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        font-family:
          "Arial",
          "Verdana",
          "Geneva",
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--brand-bg);
        color: var(--brand-text);
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }

      /* ── Header ──────────────────────────────────────────── */
      .page-header {
        background: var(--brand-navy);
        padding: 0.85rem 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .page-header-left {
        display: flex;
        align-items: center;
        gap: 1rem;
      }
      .page-header-logo {
        width: 32px;
        height: 32px;
        background: var(--brand-amber);
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        flex-shrink: 0;
      }
      .page-header-title {
        color: #fff;
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: 0.01em;
        line-height: 1.2;
      }
      .page-header-subtitle {
        color: rgba(255, 255, 255, 0.55);
        font-size: 0.78rem;
        font-weight: 400;
        margin-top: 1px;
      }
      .btn-back {
        font-family: inherit;
        font-size: 0.82rem;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.8);
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        padding: 0.4rem 0.85rem;
        cursor: pointer;
        text-decoration: none;
        transition: background 0.15s;
        white-space: nowrap;
      }
      .btn-back:hover {
        background: rgba(255, 255, 255, 0.18);
      }

      /* ── Page body ───────────────────────────────────────── */
      .page-body {
        padding: 2rem 1.5rem;
        max-width: 1400px;
        margin: 0 auto;
      }

      /* ── Card ────────────────────────────────────────────── */
      .card {
        background: var(--brand-card);
        border: 1px solid var(--brand-border);
        border-radius: 14px;
        padding: 1.75rem 1.75rem 1.25rem;
        box-shadow: 0 2px 16px rgba(26, 58, 92, 0.07);
      }

      /* ── Top bar ─────────────────────────────────────────── */
      .top-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
        margin-bottom: 0.5rem;
      }
      .top-bar h2 {
        margin: 0;
        font-size: 1.2rem;
        font-weight: 800;
        color: var(--brand-navy);
      }
      .summary {
        font-size: 0.82rem;
        color: var(--brand-muted);
        margin: 0 0 1.25rem;
      }

      /* ── Controls ────────────────────────────────────────── */
      .controls {
        display: grid;
        grid-template-columns: 1.6fr 1fr 1fr auto;
        gap: 0.65rem;
        align-items: end;
        margin-bottom: 1.25rem;
      }
      .control-field {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }
      .control-field label {
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--brand-label);
        letter-spacing: 0.01em;
      }
      .control-field input,
      .control-field select {
        background: var(--brand-input-bg);
        border: 1.5px solid var(--brand-input-border);
        border-radius: 7px;
        padding: 0.5rem 0.7rem;
        font-family: inherit;
        font-size: 0.88rem;
        color: var(--brand-text);
        outline: none;
        transition: border-color 0.15s;
      }
      .control-field input:focus,
      .control-field select:focus {
        border-color: var(--brand-navy);
      }
      .btn-export {
        font-family: inherit;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--brand-navy);
        background: #fff;
        border: 1.5px solid var(--brand-border);
        border-radius: 7px;
        padding: 0.5rem 1rem;
        cursor: pointer;
        white-space: nowrap;
        transition:
          background 0.15s,
          border-color 0.15s;
        align-self: end;
      }
      .btn-export:hover {
        background: var(--brand-th-bg);
        border-color: #b0bec8;
      }
      .btn-export:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      @media (max-width: 860px) {
        .controls {
          grid-template-columns: 1fr 1fr;
        }
        .btn-export {
          grid-column: 1 / -1;
        }
      }
      @media (max-width: 540px) {
        .controls {
          grid-template-columns: 1fr;
        }
      }

      /* ── Table ───────────────────────────────────────────── */
      .table-wrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85rem;
      }
      thead tr {
        background: var(--brand-th-bg);
        border-bottom: 2px solid var(--brand-border);
      }
      th {
        padding: 0.65rem 0.85rem;
        font-size: 0.72rem;
        font-weight: 700;
        color: var(--brand-label);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        text-align: left;
        white-space: nowrap;
      }
      td {
        padding: 0.6rem 0.85rem;
        border-bottom: 1px solid var(--brand-border);
        vertical-align: middle;
        white-space: nowrap;
        color: var(--brand-text);
      }
      tbody tr:last-child td {
        border-bottom: none;
      }
      tbody tr:hover td {
        background: var(--brand-row-hover);
      }

      /* ── Reprint button ──────────────────────────────────── */
      .btn-reprint {
        font-family: inherit;
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--brand-amber);
        background: rgba(232, 119, 34, 0.08);
        border: 1.5px solid rgba(232, 119, 34, 0.35);
        border-radius: 5px;
        padding: 0.3rem 0.65rem;
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s;
        white-space: nowrap;
      }
      .btn-reprint:hover {
        background: rgba(232, 119, 34, 0.15);
        border-color: var(--brand-amber);
      }
      .btn-reprint:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .btn-reprint.printing {
        color: var(--brand-muted);
        background: var(--brand-th-bg);
        border-color: var(--brand-border);
      }
      .btn-reprint.done {
        color: var(--brand-success-text);
        background: var(--brand-success-bg);
        border-color: #b7e4c2;
      }
      .btn-reprint.failed {
        color: var(--brand-error-text);
        background: var(--brand-error-bg);
        border-color: #fecaca;
      }

      /* ── Empty / error states ────────────────────────────── */
      .state-box {
        padding: 1.5rem 1rem;
        text-align: center;
        border-radius: 8px;
        font-size: 0.9rem;
        color: var(--brand-muted);
        border: 1px dashed var(--brand-border);
        margin-top: 0.5rem;
      }
      .state-box.error {
        color: var(--brand-error-text);
        background: var(--brand-error-bg);
        border: 1px solid #fecaca;
      }
    </style>
  </head>
  <body>
    <header class="page-header">
      <div class="page-header-left">
        <div class="page-header-logo">⚡</div>
        <div>
          <div class="page-header-title" id="pageHeaderTitle">Event Admin</div>
          <div class="page-header-subtitle">Registered Attendees</div>
        </div>
      </div>
      <a href="/" class="btn-back">← Back to Check-in</a>
    </header>

    <div class="page-body">
      <div class="card">
        <div class="top-bar">
          <h2>Attendees</h2>
        </div>
        <p class="summary" id="summary">Loading attendees...</p>

        <div class="controls" id="controls" style="display: none">
          <div class="control-field">
            <label for="searchInput">Search</label>
            <input
              id="searchInput"
              type="search"
              placeholder="Name, email, company…"
            />
          </div>
          <div class="control-field">
            <label for="contactFilter">Contact permission</label>
            <select id="contactFilter">
              <option value="all">All</option>
              <option value="yes">Yes</option>
              <option value="no">No</option>
            </select>
          </div>
          <div class="control-field">
            <label for="sortBy">Sort</label>
            <select id="sortBy">
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
              <option value="name_asc">Name A→Z</option>
              <option value="name_desc">Name Z→A</option>
              <option value="company_asc">Company A→Z</option>
            </select>
          </div>
          <button id="exportCsvBtn" class="btn-export" type="button">
            ⬇ Export CSV
          </button>
        </div>

        <div id="error" class="state-box error" style="display: none"></div>
        <div id="empty" class="state-box" style="display: none">
          No attendees yet.
        </div>

        <div class="table-wrap" id="tableWrap" style="display: none">
          <table id="attendeesTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      const summary = document.getElementById("summary");
      const errorBox = document.getElementById("error");
      const emptyBox = document.getElementById("empty");
      const tableWrap = document.getElementById("tableWrap");
      const tableHead = document.getElementById("tableHead");
      const tableBody = document.getElementById("tableBody");
      const controls = document.getElementById("controls");
      const searchInput = document.getElementById("searchInput");
      const contactFilter = document.getElementById("contactFilter");
      const sortBy = document.getElementById("sortBy");
      const exportCsvBtn = document.getElementById("exportCsvBtn");
      const pageHeaderTitle = document.getElementById("pageHeaderTitle");

      let allAttendees = [];
      let currentRows = [];
      let currentOrderedKeys = [];
      let eventName = "";
      let eventLocation = "";

      const API_BASE =
        window.location.port === "8080"
          ? `${window.location.protocol}//${window.location.hostname}:8000`
          : "";

      // Load event config for header title
      (async () => {
        try {
          const res = await fetch(`${API_BASE}/api/config`);
          if (res.ok) {
            const config = await res.json();
            eventName = config.eventName || "";
            eventLocation = config.eventLocation || "";
            const label =
              eventName + (eventLocation ? ` · ${eventLocation}` : "");
            if (label) pageHeaderTitle.textContent = label;
          }
        } catch (_) {}
      })();

      function formatHeader(key) {
        return key
          .replaceAll("_", " ")
          .replace(/\b\w/g, (c) => c.toUpperCase());
      }

      function normalizeText(value) {
        return String(value ?? "")
          .trim()
          .toLowerCase();
      }

      function parseCreatedAt(attendee) {
        const ts = Date.parse(attendee.created_at || "");
        return Number.isNaN(ts) ? 0 : ts;
      }

      function attendeeName(attendee) {
        const first = normalizeText(attendee.first_name || attendee.name);
        const last = normalizeText(attendee.last_name);
        return `${first} ${last}`.trim();
      }

      // Keys excluded from table columns and CSV
      const NAMETAG_KEYS = new Set(["nametag_image_url"]);

      function buildOrderedKeys(attendees) {
        const keys = new Set();
        attendees.forEach((a) =>
          Object.keys(a).forEach((k) => {
            if (!NAMETAG_KEYS.has(k)) keys.add(k);
          }),
        );
        const priority = [
          "id",
          "first_name",
          "last_name",
          "company",
          "company_email",
          "contact_permission",
          "created_at",
        ];
        return [
          ...priority.filter((k) => keys.has(k)),
          ...Array.from(keys).filter((k) => !priority.includes(k)),
        ];
      }

      function applyFiltersAndSort(attendees) {
        const query = normalizeText(searchInput.value);
        const permission = contactFilter.value;
        const sort = sortBy.value;

        const filtered = attendees.filter((a) => {
          const permOk =
            permission === "all"
              ? true
              : permission === "yes"
                ? a.contact_permission === true
                : a.contact_permission === false;
          if (!permOk) return false;
          if (!query) return true;
          const haystack = [
            a.first_name,
            a.last_name,
            a.name,
            a.company,
            a.company_email,
          ]
            .map(normalizeText)
            .join(" ");
          return haystack.includes(query);
        });

        filtered.sort((a, b) => {
          if (sort === "oldest") return parseCreatedAt(a) - parseCreatedAt(b);
          if (sort === "name_asc")
            return attendeeName(a).localeCompare(attendeeName(b));
          if (sort === "name_desc")
            return attendeeName(b).localeCompare(attendeeName(a));
          if (sort === "company_asc")
            return normalizeText(a.company).localeCompare(
              normalizeText(b.company),
            );
          return parseCreatedAt(b) - parseCreatedAt(a);
        });

        return filtered;
      }

      async function reprintNametag(btn, attendee) {
        btn.disabled = true;
        btn.classList.add("printing");
        btn.textContent = "Printing…";

        const firstName = (attendee.first_name || attendee.name || "").trim();
        const payload = {
          firstName,
          company: attendee.company || "",
          groupName: eventName || undefined,
          location: eventLocation || undefined,
          registrationId: attendee.registration_id ?? attendee.id ?? null,
        };

        try {
          const res = await fetch(`${API_BASE}/api/print`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          btn.classList.remove("printing");
          if (res.ok) {
            btn.classList.add("done");
            btn.textContent = "✓ Sent";
          } else {
            btn.classList.add("failed");
            btn.textContent = "Failed";
          }
        } catch (_) {
          btn.classList.remove("printing");
          btn.classList.add("failed");
          btn.textContent = "Error";
        }

        setTimeout(() => {
          btn.disabled = false;
          btn.classList.remove("done", "failed");
          btn.textContent = "🖨 Print";
        }, 3000);
      }

      function renderTable(attendees) {
        // Keep a stable, reusable column order for both table render and CSV export.
        currentOrderedKeys = buildOrderedKeys(attendees);

        const headerCells = currentOrderedKeys
          .map((k) => `<th>${formatHeader(k)}</th>`)
          .join("");
        tableHead.innerHTML = `<tr>${headerCells}<th>Nametag</th></tr>`;

        tableBody.innerHTML = "";
        attendees.forEach((attendee) => {
          const tr = document.createElement("tr");

          currentOrderedKeys.forEach((key) => {
            const td = document.createElement("td");
            td.textContent = attendee[key] ?? "";
            tr.appendChild(td);
          });

          const nametd = document.createElement("td");
          const btn = document.createElement("button");
          btn.className = "btn-reprint";
          btn.textContent = "🖨 Print";
          btn.addEventListener("click", () => reprintNametag(btn, attendee));
          nametd.appendChild(btn);
          tr.appendChild(nametd);

          tableBody.appendChild(tr);
        });
      }

      function updateView() {
        currentRows = applyFiltersAndSort([...allAttendees]);

        if (allAttendees.length === 0) {
          summary.textContent = "Total attendees: 0";
          emptyBox.style.display = "block";
          tableWrap.style.display = "none";
          exportCsvBtn.disabled = true;
          return;
        }

        summary.textContent = `Total attendees: ${allAttendees.length} · Showing: ${currentRows.length}`;

        if (currentRows.length === 0) {
          emptyBox.textContent = "No attendees match the current filters.";
          emptyBox.style.display = "block";
          tableWrap.style.display = "none";
          exportCsvBtn.disabled = true;
          return;
        }

        emptyBox.style.display = "none";
        emptyBox.textContent = "No attendees yet.";
        renderTable(currentRows);
        tableWrap.style.display = "block";
        exportCsvBtn.disabled = false;
      }

      function csvEscape(value) {
        const s = String(value ?? "");
        return s.includes('"') || s.includes(",") || s.includes("\n")
          ? `"${s.replaceAll('"', '""')}"`
          : s;
      }

      function exportCsv() {
        if (currentRows.length === 0) return;
        // Exclude nametag columns from CSV export
        const columns = currentOrderedKeys.filter((k) => !NAMETAG_KEYS.has(k));
        const header = columns.map((k) => csvEscape(formatHeader(k))).join(",");
        const rows = currentRows.map((a) =>
          columns.map((k) => csvEscape(a[k] ?? "")).join(","),
        );
        const csvContent = [header, ...rows].join("\n");
        const blob = new Blob([csvContent], {
          type: "text/csv;charset=utf-8;",
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "attendees.csv";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }

      async function loadAttendees() {
        try {
          const response = await fetch(`${API_BASE}/api/admin/attendees`);
          if (!response.ok)
            throw new Error(`Request failed (${response.status})`);
          const payload = await response.json();
          allAttendees = payload.attendees || [];
          // Controls are hidden until data is available to avoid empty filtering UI.
          controls.style.display = allAttendees.length > 0 ? "grid" : "none";
          updateView();
        } catch (error) {
          summary.textContent = "Failed to load attendees";
          errorBox.textContent = error.message || "Unknown error";
          errorBox.style.display = "block";
        }
      }

      searchInput.addEventListener("input", updateView);
      contactFilter.addEventListener("change", updateView);
      sortBy.addEventListener("change", updateView);
      exportCsvBtn.addEventListener("click", exportCsv);

      loadAttendees();
    </script>
  </body>
</html>
