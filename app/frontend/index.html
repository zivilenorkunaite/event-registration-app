<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Check-in</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
    <style>
      body {
        padding: 2.5rem 1rem;
        min-height: 100vh;
      }
      main {
        max-width: 1160px;
        margin: 0 auto;
      }
      .layout-grid {
        display: grid;
        grid-template-columns: 1.45fr 1fr;
        gap: 2.5rem;
        align-items: start;
      }
      .layout-grid.hidden {
        display: none;
      }
      .left-column {
        min-width: 0;
      }
      .right-column {
        display: flex;
        justify-content: center;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.95rem 1rem;
      }
      .form-grid section {
        margin-bottom: 0;
      }
      .form-grid .full-row {
        grid-column: 1 / -1;
      }
      @media (max-width: 1100px) {
        body {
          padding: 1.25rem 0.75rem;
        }
        .card {
          padding: 1.5rem 1.25rem;
        }
        .layout-grid {
          grid-template-columns: 1.25fr 0.95fr;
          gap: 1.5rem;
        }
      }
      @media (max-width: 900px) {
        .layout-grid {
          grid-template-columns: 1fr;
          gap: 1.25rem;
        }
        .welcome {
          margin-bottom: 1.25rem;
        }
      }
      @media (max-width: 768px) {
        .card {
          padding: 1.25rem 1rem;
        }
        .form-grid {
          grid-template-columns: 1fr;
          gap: 0.9rem;
        }
      }
      .card {
        background: var(
          --pico-card-background-color,
          var(--pico-background-color)
        );
        border: 1px solid var(--pico-muted-border-color);
        border-radius: 12px;
        padding: 2rem 1.75rem;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      }
      h1 {
        text-align: center;
        margin-bottom: 0.5rem;
        font-size: 1.5rem;
        font-weight: 700;
      }
      .welcome {
        text-align: center;
        margin-bottom: 2rem;
        font-size: 0.95rem;
        color: var(--pico-muted-color);
        line-height: 1.5;
      }
      form section {
        margin-bottom: 1.35rem;
      }
      form button {
        margin-top: 0.25rem;
        padding: 0.85rem 1.5rem;
        font-weight: 600;
        border-radius: 8px;
      }
      #message {
        margin-top: 1.25rem;
        padding: 0.85rem 1rem;
        border-radius: 8px;
        text-align: center;
        font-size: 0.9rem;
        font-weight: 500;
      }
      #message.success {
        background: rgba(0, 128, 0, 0.12);
        color: #0d6b0d;
      }
      #message.error {
        background: rgba(220, 53, 69, 0.12);
        color: #b02a37;
      }
      .name-tag-wrap {
        display: flex;
        justify-content: center;
      }
      .name-tag {
        background: #fff;
        color: #1a1a1a;
        border-radius: 10px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: 80mm;
        height: 50mm;
        max-width: 80mm;
        padding: 3mm 5mm;
        box-sizing: border-box;
      }
      .name-tag-left {
        display: flex;
        flex-direction: column;
      }
      .name-tag-group,
      .name-tag-location {
        font-size: 0.5rem;
        font-weight: 500;
        color: #999;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        line-height: 1.2;
      }
      .name-tag-divider {
        border: none;
        border-top: 0.5px solid #ddd;
        margin: 1mm 0;
      }
      .name-tag-name {
        font-size: 1.2rem;
        font-weight: 800;
        color: #000;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        line-height: 1.1;
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        word-wrap: break-word;
        word-break: break-word;
        overflow: hidden;
        min-height: 0;
        padding: 1mm 2mm;
      }
      .name-tag-name.font-medium {
        font-size: 1rem;
      }
      .name-tag-name.font-small {
        font-size: 0.8rem;
      }
      .name-tag-name.placeholder,
      .name-tag-company.placeholder {
        color: #ccc;
      }
      .name-tag-company {
        font-size: 0.5rem;
        font-weight: 600;
        color: #333;
        text-align: center;
      }
      .home-screen {
        display: none;
        text-align: center;
        padding: 1.5rem 1rem;
      }
      .home-screen.active {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }
      .home-title {
        font-size: 1.6rem;
        font-weight: 700;
        margin: 0;
      }
      .home-subtitle {
        margin: 0;
        color: var(--pico-muted-color);
      }
      .printer-status-footer {
        margin-top: 1rem;
        text-align: center;
        font-size: 0.9rem;
        color: var(--pico-muted-color);
      }
      .printer-status-footer.online {
        color: #0d6b0d;
      }
      .printer-status-footer.offline {
        color: #b02a37;
      }
      .home-checkin-btn {
        width: min(420px, 100%);
        padding: 1rem 1.5rem;
        border-radius: 10px;
        font-size: 1.35rem;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <div class="layout-grid" id="layoutGrid">
          <div class="left-column">
            <h1>📋 Event Check-in</h1>
            <p class="welcome">
              Welcome! Please fill in your details to check in for the event.
            </p>

            <form id="registrationForm">
              <div class="form-grid">
                <section>
                  <label for="firstName">First Name *</label>
                  <input type="text" id="firstName" name="firstName" required />
                </section>
                <section>
                  <label for="lastName">Last Name *</label>
                  <input type="text" id="lastName" name="lastName" required />
                </section>
                <section>
                  <label for="company">Company *</label>
                  <input type="text" id="company" name="company" required />
                </section>
                <section>
                  <label for="email">Email *</label>
                  <input type="email" id="email" name="email" required />
                </section>
                <section class="full-row">
                  <label for="contactPermission">
                    <input
                      type="checkbox"
                      id="contactPermission"
                      name="contactPermission"
                    />
                    I agree to be contacted about future events
                  </label>
                </section>
              </div>

              <button type="submit">Check In</button>
            </form>

            <div id="message"></div>
          </div>

          <div class="right-column">
            <div class="name-tag-wrap">
              <div class="name-tag" id="nameTagPreview">
                <div class="name-tag-left">
                  <div class="name-tag-group" id="previewEventName">
                    Energy &amp; Utilities Connect Sydney
                  </div>
                  <div class="name-tag-location" id="previewEventLocation">
                    Sydney
                  </div>
                </div>

                <hr class="name-tag-divider" />

                <div class="name-tag-name placeholder" id="previewName">
                  YOUR NAME
                </div>

                <hr class="name-tag-divider" />

                <div class="name-tag-company placeholder" id="previewCompany">
                  YOUR COMPANY
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="home-screen" id="homeScreen">
          <p class="home-title">✅ Check-in successful</p>
          <p class="home-subtitle" id="homeSubtitle">
            Ready for the next attendee.
          </p>
          <button type="button" class="home-checkin-btn" id="homeCheckInBtn">
            Check In
          </button>
        </div>

        <div class="printer-status-footer" id="printerStatusFooter">
          Printer status: checking...
        </div>
      </div>
    </main>

    <script>
      const form = document.getElementById("registrationForm");
      const messageDiv = document.getElementById("message");
      const layoutGrid = document.getElementById("layoutGrid");
      const homeScreen = document.getElementById("homeScreen");
      const homeCheckInBtn = document.getElementById("homeCheckInBtn");
      const homeSubtitle = document.getElementById("homeSubtitle");
      const printerStatusFooter = document.getElementById(
        "printerStatusFooter",
      );
      const previewName = document.getElementById("previewName");
      const previewCompany = document.getElementById("previewCompany");
      const previewEventName = document.getElementById("previewEventName");
      const previewEventLocation = document.getElementById(
        "previewEventLocation",
      );
      const firstNameInput = document.getElementById("firstName");
      const companyInput = document.getElementById("company");
      const API_BASE =
        window.location.port === "8080"
          ? `${window.location.protocol}//${window.location.hostname}:8000`
          : "";
      const apiUrl = (path) => `${API_BASE}${path}`;
      let printerAvailable = false;

      async function refreshPrinterStatus() {
        try {
          const response = await fetch(apiUrl("/api/printer-status"));
          if (!response.ok) {
            throw new Error("Status request failed");
          }
          const status = await response.json();
          printerAvailable = !!status.available;

          if (printerAvailable) {
            printerStatusFooter.textContent =
              "Printer connected — name tags are being printed.";
            printerStatusFooter.className = "printer-status-footer online";
          } else {
            printerStatusFooter.textContent =
              "Printer offline — check-in still works, printing is unavailable.";
            printerStatusFooter.className = "printer-status-footer offline";
          }
        } catch (error) {
          printerAvailable = false;
          printerStatusFooter.textContent =
            "Printer status unavailable — check-in still works.";
          printerStatusFooter.className = "printer-status-footer offline";
        }
      }

      async function loadFrontendConfig() {
        try {
          const response = await fetch(apiUrl("/api/config"));
          if (!response.ok) {
            return;
          }
          const config = await response.json();
          if (config?.eventName) {
            previewEventName.textContent = config.eventName;
          }
          if (config?.eventLocation) {
            previewEventLocation.textContent = config.eventLocation;
          }
        } catch (error) {
          console.warn("Config load skipped:", error);
        }
      }

      function updatePreview() {
        const firstName = firstNameInput.value.trim();
        const company = companyInput.value.trim();

        previewName.textContent = firstName || "YOUR NAME";
        previewName.classList.toggle("placeholder", !firstName);
        previewName.classList.remove("font-medium", "font-small");

        if (firstName.length > 11) {
          previewName.classList.add("font-small");
        } else if (firstName.length > 8) {
          previewName.classList.add("font-medium");
        }

        previewCompany.textContent = company || "YOUR COMPANY";
        previewCompany.classList.toggle("placeholder", !company);
      }

      firstNameInput.addEventListener("input", updatePreview);
      companyInput.addEventListener("input", updatePreview);
      loadFrontendConfig();
      refreshPrinterStatus();
      updatePreview();

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        await refreshPrinterStatus();
        messageDiv.textContent = "Processing...";
        messageDiv.className = "";

        const data = {
          firstName: form.firstName.value,
          lastName: form.lastName.value,
          company: form.company.value,
          email: form.email.value,
          contactPermission: form.contactPermission.checked,
        };

        try {
          const response = await fetch(apiUrl("/api/register"), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });

          const result = await response.json();

          if (response.ok) {
            const nameTagData = {
              firstName: data.firstName,
              company: data.company,
              groupName: previewEventName.textContent,
              location: previewEventLocation.textContent,
            };

            let didPrint = false;
            try {
              const printResponse = await fetch(apiUrl("/api/print"), {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(nameTagData),
              });

              const printResult = await printResponse.json();
              didPrint = !!printResult?.data?.printed;
            } catch (printError) {
              didPrint = false;
              console.warn("Name tag save/print request failed:", printError);
            }

            messageDiv.textContent = "";
            messageDiv.className = "";
            form.reset();
            updatePreview();
            homeSubtitle.textContent = didPrint
              ? "Please pick up your name tag. Ready for the next attendee."
              : "Ready for the next attendee.";
            layoutGrid.classList.add("hidden");
            homeScreen.classList.add("active");
            refreshPrinterStatus();
          } else {
            messageDiv.textContent =
              result.detail || "An error occurred. Please try again.";
            messageDiv.className = "error";
          }
        } catch (error) {
          messageDiv.textContent =
            "Error: Unable to connect to server. Please try again.";
          messageDiv.className = "error";
          console.error("Error:", error);
        }
      });

      homeCheckInBtn.addEventListener("click", () => {
        refreshPrinterStatus();
        homeScreen.classList.remove("active");
        layoutGrid.classList.remove("hidden");
        messageDiv.textContent = "";
        messageDiv.className = "";
        firstNameInput.focus();
      });
    </script>
  </body>
</html>
