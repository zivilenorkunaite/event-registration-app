<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Check-in</title>
    <link rel="icon" type="image/svg+xml" href="/favicon-energy.svg?v=2" />
    <link rel="shortcut icon" href="/favicon-energy.svg?v=2" />
    <style>
      @font-face {
        font-family: "DM Sans";
        src: url("/fonts/DMSans-Variable.ttf") format("truetype");
        font-style: normal;
        font-weight: 100 1000;
        font-display: swap;
      }

      :root {
        --brand-navy: #1a3a5c;
        --brand-navy-dark: #112640;
        --brand-amber: #e87722;
        --brand-amber-hover: #d0681a;
        --brand-bg: #f0f3f7;
        --brand-card: #ffffff;
        --brand-border: #dce3ec;
        --brand-text: #1a2a3a;
        --brand-muted: #6b7a8d;
        --brand-label: #374a5e;
        --brand-input-bg: #f7f9fc;
        --brand-input-border: #c8d3df;
        --brand-input-focus: #1a3a5c;
        --brand-success-bg: #eaf7ec;
        --brand-success-text: #1a6b2e;
        --brand-error-bg: #fef2f2;
        --brand-error-text: #b91c1c;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        font-family:
          "Arial",
          "DM Sans",
          "Verdana",
          "Geneva",
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--brand-bg);
        color: var(--brand-text);
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }

      /* ── Page header bar ─────────────────────────────────── */
      .page-header {
        background: var(--brand-navy);
        padding: 0.85rem 2rem;
        display: flex;
        align-items: center;
        gap: 1rem;
      }
      .page-header-logo {
        width: 32px;
        height: 32px;
        background: var(--brand-amber);
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        flex-shrink: 0;
      }
      .page-header-title {
        color: #fff;
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: 0.01em;
        line-height: 1.2;
      }
      .page-header-subtitle {
        color: rgba(255, 255, 255, 0.55);
        font-size: 0.78rem;
        font-weight: 400;
        margin-top: 1px;
      }

      /* ── Page body ───────────────────────────────────────── */
      .page-body {
        padding: 2.5rem 1.5rem;
        max-width: 1100px;
        margin: 0 auto;
      }

      /* ── Card ────────────────────────────────────────────── */
      .card {
        background: var(--brand-card);
        border: 1px solid var(--brand-border);
        border-radius: 14px;
        padding: 2.25rem 2rem;
        box-shadow: 0 2px 16px rgba(26, 58, 92, 0.07);
      }

      /* ── Layout grid ─────────────────────────────────────── */
      .layout-grid {
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        gap: 3rem;
        align-items: start;
      }
      .layout-grid.hidden {
        display: none;
      }
      .left-column {
        min-width: 0;
      }
      .right-column {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        padding-top: 0.5rem;
      }

      /* ── Form heading ────────────────────────────────────── */
      .form-heading {
        margin: 0 0 0.35rem 0;
        font-size: 1.45rem;
        font-weight: 800;
        color: var(--brand-navy);
        letter-spacing: -0.01em;
      }
      .form-subheading {
        margin: 0 0 1.85rem 0;
        font-size: 0.9rem;
        color: var(--brand-muted);
        line-height: 1.5;
      }

      /* ── Form grid ───────────────────────────────────────── */
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.9rem 1.1rem;
      }
      .form-field {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
      }
      .form-field.full-row {
        grid-column: 1 / -1;
      }
      .form-field label {
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--brand-label);
        letter-spacing: 0.01em;
      }
      .form-field input[type="text"],
      .form-field input[type="email"] {
        background: var(--brand-input-bg);
        border: 1.5px solid var(--brand-input-border);
        border-radius: 7px;
        padding: 0.6rem 0.8rem;
        font-family: inherit;
        font-size: 0.92rem;
        color: var(--brand-text);
        outline: none;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .form-field input[type="text"]:focus,
      .form-field input[type="email"]:focus {
        border-color: var(--brand-input-focus);
        box-shadow: 0 0 0 3px rgba(26, 58, 92, 0.1);
      }
      .form-field input[type="text"]::placeholder,
      .form-field input[type="email"]::placeholder {
        color: #b0bbc8;
      }

      /* checkbox row */
      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin-top: 0.25rem;
      }
      .checkbox-row input[type="checkbox"] {
        width: 16px;
        height: 16px;
        accent-color: var(--brand-navy);
        flex-shrink: 0;
        cursor: pointer;
      }
      .checkbox-row label {
        font-size: 0.87rem;
        color: var(--brand-muted);
        cursor: pointer;
        line-height: 1.4;
      }

      /* submit button */
      .btn-checkin {
        margin-top: 1.25rem;
        width: 100%;
        padding: 0.85rem 1.5rem;
        background: var(--brand-amber);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-family: inherit;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0.01em;
        cursor: pointer;
        transition:
          background 0.15s,
          transform 0.1s;
      }
      .btn-checkin:hover {
        background: var(--brand-amber-hover);
      }
      .btn-checkin:active {
        transform: scale(0.99);
      }

      /* messages */
      #message {
        margin-top: 1rem;
        padding: 0.8rem 1rem;
        border-radius: 8px;
        font-size: 0.88rem;
        font-weight: 500;
        text-align: center;
      }
      #message.success {
        background: var(--brand-success-bg);
        color: var(--brand-success-text);
        border: 1px solid #b7e4c2;
      }
      #message.error {
        background: var(--brand-error-bg);
        color: var(--brand-error-text);
        border: 1px solid #fecaca;
      }

      /* ── Nametag preview label ───────────────────────────── */
      .nametag-label {
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--brand-muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        text-align: center;
      }

      /* ── Responsive ──────────────────────────────────────── */
      @media (max-width: 900px) {
        .layout-grid {
          grid-template-columns: 1fr;
          gap: 1.5rem;
        }
        .right-column {
          padding-top: 0;
        }
      }
      @media (max-width: 600px) {
        .page-body {
          padding: 1.25rem 0.75rem;
        }
        .card {
          padding: 1.5rem 1.1rem;
        }
        .form-grid {
          grid-template-columns: 1fr;
          gap: 0.75rem;
        }
      }
      .name-tag-wrap {
        display: flex;
        justify-content: center;
      }
      .name-tag {
        background: #fff;
        color: #1a1a1a;
        border-radius: 6px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
        width: 70mm;
        height: 40mm;
        max-width: 70mm;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .name-tag-header {
        background: #1a1a1a;
        height: 23%;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 8px;
        gap: 2px;
        overflow: hidden;
      }
      .name-tag-group {
        font-size: 0.62rem;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        line-height: 1;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
      }
      .name-tag-location {
        font-size: 0.52rem;
        font-weight: 500;
        color: #aaaaaa;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        line-height: 1;
        text-align: center;
      }
      .name-tag-name-zone {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding: 0 8px;
      }
      .name-tag-name {
        font-size: 2rem;
        font-weight: 800;
        color: #000;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        word-wrap: break-word;
        word-break: break-word;
        overflow: hidden;
        min-height: 0;
        padding: 0;
      }
      .name-tag-name.placeholder,
      .name-tag-company.placeholder {
        color: #ccc;
      }
      .name-tag-footer {
        border-top: 2px solid #cccccc;
        height: 21%;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 8px;
        overflow: hidden;
      }
      .name-tag-company {
        font-size: 0.62rem;
        font-weight: 600;
        color: #444444;
        text-align: center;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        line-height: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
      }
      .home-screen {
        display: none;
        text-align: center;
        padding: 2.5rem 1rem;
      }
      .home-screen.active {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }
      .home-title {
        font-size: 1.6rem;
        font-weight: 800;
        margin: 0;
        color: var(--brand-navy);
      }
      .home-subtitle {
        margin: 0;
        color: var(--brand-muted);
        font-size: 0.95rem;
      }
      .printer-status-footer {
        margin-top: 1.25rem;
        text-align: center;
        font-size: 0.82rem;
        color: var(--brand-muted);
        padding-top: 1rem;
        border-top: 1px solid var(--brand-border);
      }
      .printer-status-footer.online {
        color: var(--brand-success-text);
      }
      .printer-status-footer.offline {
        color: var(--brand-error-text);
      }
      .home-checkin-btn {
        width: min(420px, 100%);
        padding: 1rem 1.5rem;
        border-radius: 10px;
        font-family: inherit;
        font-size: 1.2rem;
        font-weight: 700;
        background: var(--brand-amber);
        color: #fff;
        border: none;
        cursor: pointer;
        transition: background 0.15s;
      }
      .home-checkin-btn:hover {
        background: var(--brand-amber-hover);
      }
    </style>
  </head>
  <body>
    <header class="page-header">
      <div class="page-header-logo">⚡</div>
      <div>
        <div class="page-header-title" id="pageHeaderTitle">Event Check-in</div>
        <div class="page-header-subtitle">Event Check-in</div>
      </div>
    </header>

    <div class="page-body">
      <div class="card">
        <div class="layout-grid" id="layoutGrid">
          <div class="left-column">
            <h2 class="form-heading">Welcome! 👋</h2>
            <p class="form-subheading">
              Fill in your details to check in and get your name tag.
            </p>

            <form
              id="registrationForm"
              autocomplete="off"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
              data-lpignore="true"
            >
              <input
                type="text"
                name="username"
                autocomplete="username"
                tabindex="-1"
                aria-hidden="true"
                style="
                  position: absolute;
                  left: -10000px;
                  top: auto;
                  width: 1px;
                  height: 1px;
                  opacity: 0;
                  pointer-events: none;
                "
              />
              <input
                type="password"
                name="password"
                autocomplete="current-password"
                tabindex="-1"
                aria-hidden="true"
                style="
                  position: absolute;
                  left: -10000px;
                  top: auto;
                  width: 1px;
                  height: 1px;
                  opacity: 0;
                  pointer-events: none;
                "
              />
              <div class="form-grid">
                <div class="form-field">
                  <label for="firstName">First Name *</label>
                  <input
                    type="text"
                    id="firstName"
                    name="reg_field_a"
                    placeholder="Jane"
                    autocomplete="new-password"
                    autocapitalize="words"
                    autocorrect="off"
                    spellcheck="false"
                    data-lpignore="true"
                    readonly
                    required
                  />
                </div>
                <div class="form-field">
                  <label for="lastName">Last Name *</label>
                  <input
                    type="text"
                    id="lastName"
                    name="reg_field_b"
                    placeholder="Smith"
                    autocomplete="new-password"
                    autocapitalize="words"
                    autocorrect="off"
                    spellcheck="false"
                    data-lpignore="true"
                    readonly
                    required
                  />
                </div>
                <div class="form-field">
                  <label for="company">Company *</label>
                  <input
                    type="text"
                    id="company"
                    name="reg_field_c"
                    placeholder="Acme Energy"
                    autocomplete="new-password"
                    autocapitalize="words"
                    autocorrect="off"
                    spellcheck="false"
                    data-lpignore="true"
                    readonly
                    required
                  />
                </div>
                <div class="form-field">
                  <label for="email">Email *</label>
                  <input
                    type="email"
                    id="email"
                    name="reg_field_d"
                    placeholder="jane@example.com"
                    autocomplete="new-password"
                    autocapitalize="off"
                    autocorrect="off"
                    spellcheck="false"
                    data-lpignore="true"
                    readonly
                    required
                  />
                </div>
                <div class="form-field full-row">
                  <div class="checkbox-row">
                    <input
                      type="checkbox"
                      id="contactPermission"
                      name="contactPermission"
                    />
                    <label for="contactPermission"
                      >I agree to be contacted about future events</label
                    >
                  </div>
                </div>
              </div>

              <button type="submit" class="btn-checkin">Check In →</button>
            </form>

            <div id="message"></div>
          </div>

          <div class="right-column">
            <div class="nametag-label">Your name tag preview</div>
            <div class="name-tag-wrap">
              <div class="name-tag" id="nameTagPreview">
                <div class="name-tag-header">
                  <div class="name-tag-group" id="previewEventName">
                    Energy &amp; Utilities Connect
                  </div>
                  <div class="name-tag-location" id="previewEventLocation">
                    Sydney
                  </div>
                </div>
                <div class="name-tag-name-zone">
                  <div class="name-tag-name placeholder" id="previewName">
                    YOUR NAME
                  </div>
                </div>
                <div class="name-tag-footer">
                  <div class="name-tag-company placeholder" id="previewCompany">
                    YOUR COMPANY
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="home-screen" id="homeScreen">
          <p class="home-title">✅ Checked in!</p>
          <p class="home-subtitle" id="homeSubtitle">
            Ready for the next attendee.
          </p>
          <button type="button" class="home-checkin-btn" id="homeCheckInBtn">
            Next Check-in →
          </button>
        </div>

        <div class="printer-status-footer" id="printerStatusFooter">
          Printer status: checking...
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById("registrationForm");
      const messageDiv = document.getElementById("message");
      const layoutGrid = document.getElementById("layoutGrid");
      const homeScreen = document.getElementById("homeScreen");
      const homeCheckInBtn = document.getElementById("homeCheckInBtn");
      const homeSubtitle = document.getElementById("homeSubtitle");
      const printerStatusFooter = document.getElementById(
        "printerStatusFooter",
      );
      const previewName = document.getElementById("previewName");
      const previewCompany = document.getElementById("previewCompany");
      const pageHeaderTitle = document.getElementById("pageHeaderTitle");
      const previewEventName = document.getElementById("previewEventName");
      const previewEventLocation = document.getElementById(
        "previewEventLocation",
      );
      const nameTagContent = document.getElementById("nameTagPreview");
      const firstNameInput = document.getElementById("firstName");
      const lastNameInput = document.getElementById("lastName");
      const companyInput = document.getElementById("company");
      const emailInput = document.getElementById("email");
      const API_BASE =
        window.location.port === "8080"
          ? `${window.location.protocol}//${window.location.hostname}:8000`
          : "";
      const apiUrl = (path) => `${API_BASE}${path}`;
      let printerAvailable = false;
      let isDatabricksApp = false;

      async function maybeRefreshPrinterStatus() {
        if (isDatabricksApp) {
          return;
        }
        await refreshPrinterStatus();
      }

      async function refreshPrinterStatus() {
        try {
          const response = await fetch(apiUrl("/api/printer-status"));
          if (!response.ok) {
            throw new Error("Status request failed");
          }
          const status = await response.json();
          printerAvailable = !!status.available;

          if (
            status?.printingEnabled === false ||
            status?.mode === "databricks_app"
          ) {
            printerStatusFooter.textContent =
              "Managed mode — check-in, image save, and queueing are active.";
            printerStatusFooter.className = "printer-status-footer online";
            return;
          }

          if (printerAvailable) {
            printerStatusFooter.textContent =
              "Printer connected — name tags are being printed.";
            printerStatusFooter.className = "printer-status-footer online";
          } else {
            printerStatusFooter.textContent =
              "Printer offline — check-in still works, printing is unavailable.";
            printerStatusFooter.className = "printer-status-footer offline";
          }
        } catch (error) {
          printerAvailable = false;
          printerStatusFooter.textContent =
            "Printer status unavailable — check-in still works.";
          printerStatusFooter.className = "printer-status-footer offline";
        }
      }

      async function loadFrontendConfig() {
        try {
          const response = await fetch(apiUrl("/api/config"));
          if (!response.ok) {
            return;
          }
          const config = await response.json();
          isDatabricksApp = !!config?.isDatabricksApp;
          if (config?.eventName) {
            previewEventName.textContent = config.eventName;
          }
          if (config?.eventLocation) {
            previewEventLocation.textContent = config.eventLocation;
          }
          if (isDatabricksApp) {
            printerStatusFooter.textContent =
              "Managed mode — check-in, image save, and queueing are active.";
            printerStatusFooter.className = "printer-status-footer online";
          }
          const name = config?.eventName || previewEventName.textContent;
          const loc = config?.eventLocation || previewEventLocation.textContent;
          pageHeaderTitle.textContent = loc ? `${name} · ${loc}` : name;
          updatePreview();
        } catch (error) {
          console.warn("Config load skipped:", error);
        }
      }

      function fitTextToBox(element, text, opts = {}) {
        const maxSize = opts.maxSize ?? 40;
        const minSize = opts.minSize ?? 10;
        const fontWeight = opts.fontWeight ?? 700;
        const displayText = String(text || " ");
        const boxWidth = Math.max(1, element.clientWidth - 2);
        const boxHeight = Math.max(1, element.clientHeight - 2);

        if (!boxWidth || !boxHeight) {
          return;
        }

        if (!fitTextToBox.canvas) {
          fitTextToBox.canvas = document.createElement("canvas");
        }
        const context = fitTextToBox.canvas.getContext("2d");

        let size = minSize;
        for (let candidate = maxSize; candidate >= minSize; candidate -= 1) {
          context.font = `${fontWeight} ${candidate}px Arial, Helvetica, sans-serif`;
          const measuredWidth = context.measureText(displayText).width;
          const estimatedHeight = candidate * 1.04;
          if (measuredWidth <= boxWidth && estimatedHeight <= boxHeight) {
            size = candidate;
            break;
          }
        }

        element.style.fontSize = `${size}px`;
      }

      function updatePreview() {
        const firstName = firstNameInput.value.trim().toUpperCase();
        const company = companyInput.value.trim();

        previewName.textContent = firstName || "YOUR NAME";
        previewName.classList.toggle("placeholder", !firstName);

        previewCompany.textContent = company || "YOUR COMPANY";
        previewCompany.classList.toggle("placeholder", !company);

        if (!nameTagContent) {
          return;
        }

        requestAnimationFrame(() => {
          fitTextToBox(
            previewEventName,
            previewEventName.textContent.toUpperCase(),
            {
              maxSize: 16,
              minSize: 10,
              fontWeight: 500,
            },
          );
          fitTextToBox(
            previewEventLocation,
            previewEventLocation.textContent.toUpperCase(),
            {
              maxSize: 15,
              minSize: 10,
              fontWeight: 500,
            },
          );
          fitTextToBox(previewName, previewName.textContent, {
            maxSize: 72,
            minSize: 20,
            fontWeight: 800,
          });
          fitTextToBox(previewCompany, previewCompany.textContent, {
            maxSize: 30,
            minSize: 12,
            fontWeight: 600,
          });
        });
      }

      function enableManualInput(event) {
        const target = event.target;
        if (target && target.hasAttribute("readonly")) {
          target.removeAttribute("readonly");
        }
      }

      firstNameInput.addEventListener("input", updatePreview);
      companyInput.addEventListener("input", updatePreview);
      [firstNameInput, lastNameInput, companyInput, emailInput].forEach(
        (input) => {
          input.addEventListener("focus", enableManualInput, { once: true });
          input.addEventListener("pointerdown", enableManualInput, {
            once: true,
          });
        },
      );
      loadFrontendConfig().then(maybeRefreshPrinterStatus);
      updatePreview();
      window.addEventListener("resize", updatePreview);

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        await maybeRefreshPrinterStatus();
        messageDiv.textContent = "Processing...";
        messageDiv.className = "";

        const data = {
          firstName: firstNameInput.value,
          lastName: lastNameInput.value,
          company: companyInput.value,
          email: emailInput.value,
          contactPermission: form.contactPermission.checked,
        };

        try {
          const response = await fetch(apiUrl("/api/register"), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });

          const result = await response.json();

          if (response.ok) {
            let didPrint = false;
            if (result?.printResult) {
              didPrint = !!result?.printResult?.data?.printed;
            } else {
              const nameTagData = {
                firstName: data.firstName,
                company: data.company,
                groupName: previewEventName.textContent,
                location: previewEventLocation.textContent,
                registrationId: result.registrationId || null,
              };

              try {
                const printResponse = await fetch(apiUrl("/api/print"), {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify(nameTagData),
                });

                const printResult = await printResponse.json();
                didPrint = !!printResult?.data?.printed;
              } catch (printError) {
                didPrint = false;
                console.warn("Name tag save/print request failed:", printError);
              }
            }

            messageDiv.textContent = "";
            messageDiv.className = "";
            form.reset();
            updatePreview();
            homeSubtitle.textContent = didPrint
              ? "Please pick up your name tag. Ready for the next attendee."
              : "Ready for the next attendee.";
            layoutGrid.classList.add("hidden");
            homeScreen.classList.add("active");
            maybeRefreshPrinterStatus();
          } else {
            const detailMessage =
              typeof result.detail === "string"
                ? result.detail
                : result.detail?.message;
            messageDiv.textContent =
              detailMessage || "An error occurred. Please try again.";
            messageDiv.className = "error";
          }
        } catch (error) {
          messageDiv.textContent =
            "Error: Unable to connect to server. Please try again.";
          messageDiv.className = "error";
          console.error("Error:", error);
        }
      });

      homeCheckInBtn.addEventListener("click", () => {
        maybeRefreshPrinterStatus();
        homeScreen.classList.remove("active");
        layoutGrid.classList.remove("hidden");
        messageDiv.textContent = "";
        messageDiv.className = "";
        firstNameInput.focus();
      });
    </script>
  </body>
</html>
