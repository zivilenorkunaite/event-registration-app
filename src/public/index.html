<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Check-in</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
    <style>
      body {
        padding: 2.5rem 1rem;
        min-height: 100vh;
      }
      main {
        max-width: 850px; /* Widened for two columns */
        margin: 0 auto;
      }
      .card {
        background: var(
          --pico-card-background-color,
          var(--pico-background-color)
        );
        border: 1px solid var(--pico-muted-border-color);
        border-radius: 12px;
        padding: 2rem 1.75rem;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      }

      /* Two Column Layout Grid */
      .layout-grid {
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        gap: 3rem;
        align-items: center; /* Vertically centers the right column */
        transition: opacity 0.3s ease;
      }
      .layout-grid.hidden {
        display: none;
      }

      @media (max-width: 768px) {
        .layout-grid {
          grid-template-columns: 1fr;
          gap: 2rem;
        }
      }

      h1 {
        text-align: center;
        margin-bottom: 0.5rem;
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .welcome {
        text-align: center;
        margin-bottom: 2rem;
        font-size: 0.95rem;
        color: var(--pico-muted-color);
        line-height: 1.5;
      }
      .welcome b {
        font-weight: 600;
        color: var(--pico-color);
      }
      form section {
        margin-bottom: 1.35rem;
      }
      form section:last-of-type {
        margin-bottom: 1.5rem;
      }
      form label {
        font-size: 0.9rem;
        font-weight: 500;
      }
      form button {
        margin-top: 0.25rem;
        padding: 0.85rem 1.5rem;
        font-weight: 600;
        border-radius: 8px;
      }
      #message {
        margin-top: 1.25rem;
        padding: 0.85rem 1rem;
        border-radius: 8px;
        text-align: center;
        font-size: 0.9rem;
        font-weight: 500;
      }
      #message.success {
        background: var(--pico-ins-background-color, rgba(0, 128, 0, 0.12));
        color: var(--pico-ins-color, #0d6b0d);
      }
      #message.error {
        background: var(--pico-del-background-color, rgba(220, 53, 69, 0.12));
        color: var(--pico-del-color, #b02a37);
      }
      input[type="checkbox"] {
        margin-right: 0.5rem;
      }

      /* Name tag preview */
      .name-tag-wrap {
        display: flex;
        justify-content: center;
      }
      .name-tag {
        background: #fff;
        color: #1a1a1a;
        border-radius: 10px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        /* Print dimensions for Niimbot B3S Pro (80mm x 50mm landscape) */
        width: 80mm;
        height: 50mm;
        max-width: 80mm;
        padding: 3mm 5mm;
        box-sizing: border-box;
      }

      /* Top section: Event name and location */
      .name-tag-left {
        display: flex;
        flex-direction: column;
        flex: 0 0 auto;
      }
      .name-tag-group {
        font-size: 0.5rem;
        font-weight: 500;
        color: #999;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        line-height: 1.2;
      }
      .name-tag-location {
        font-size: 0.5rem;
        font-weight: 500;
        color: #999;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        line-height: 1.2;
      }

      /* Dividers */
      .name-tag-divider {
        border: none;
        border-top: 0.5px solid #ddd;
        margin: 1mm 0;
        flex: 0 0 auto;
      }

      /* Middle section: Name */
      .name-tag-name {
        font-size: 1.2rem;
        font-weight: 800;
        color: #000;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        line-height: 1.1;
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        word-wrap: break-word;
        word-break: break-word;
        overflow: hidden;
        min-height: 0;
        padding: 1mm 2mm;
      }
      .name-tag-name.placeholder {
        color: #ccc;
        font-weight: 600;
      }

      /* Bottom section: Company */
      .name-tag-company {
        font-size: 0.5rem;
        font-weight: 600;
        color: #333;
        text-transform: none;
        line-height: 1.2;
        flex: 0 0 auto;
        text-align: center;
      }
      .name-tag-company.placeholder {
        color: #ccc;
      }

      /* Print-specific styles for Niimbot B3S Pro - 80mm x 50mm labels */
      @media print {
        body {
          margin: 0;
          padding: 0;
        }
        @page {
          size: 80mm 50mm;
          margin: 0;
        }

        /* Hide UI elements during print */
        .left-column,
        #confirmationScreen,
        #message {
          display: none !important;
        }

        .layout-grid {
          display: block !important;
          gap: 0 !important;
        }

        .card {
          padding: 0 !important;
          border: none !important;
          box-shadow: none !important;
        }

        .name-tag {
          width: 80mm !important;
          max-width: 80mm !important;
          min-width: 80mm !important;
          height: 50mm !important;
          padding: 3mm 5mm !important;
          margin: 0 auto !important;
          border-radius: 0 !important;
          box-shadow: none !important;
          page-break-inside: avoid;
        }
        .name-tag-left {
          display: flex !important;
          flex-direction: column !important;
          flex-shrink: 0 !important;
        }
        .name-tag-group {
          font-size: 2.8mm !important;
          font-weight: 500 !important;
          color: #999 !important;
          line-height: 1.1 !important;
        }
        .name-tag-location {
          font-size: 2.8mm !important;
          font-weight: 500 !important;
          color: #999 !important;
          line-height: 1.1 !important;
        }
        .name-tag-name {
          font-size: 14mm !important;
          font-weight: 800 !important;
          color: #000 !important;
          line-height: 1.1 !important;
          flex: 1 !important;
          padding: 1mm 2mm !important;
        }
        .name-tag-company {
          font-size: 3.5mm !important;
          font-weight: 600 !important;
          color: #333 !important;
          line-height: 1.2 !important;
        }
        .name-tag-divider {
          margin: 0.8mm 0 !important;
          border-top: 0.3mm solid #ddd !important;
        }
        .name-tag-wrap {
          margin: 0 !important;
          display: block !important;
        }
      }

      /* Confirmation screen */
      .confirmation-screen {
        display: none;
        text-align: center;
      }
      .confirmation-screen.active {
        display: block;
      }
      .confirmation-message {
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--pico-color);
        margin-bottom: 1.5rem;
      }
      .confirmation-buttons {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        max-width: 400px;
        margin: 0 auto;
      }
      .print-btn,
      .new-registration-btn {
        padding: 0.85rem 2rem;
        font-weight: 600;
        border-radius: 8px;
        width: 100%;
      }
      .print-btn {
        background-color: var(--pico-primary-background, #005596);
        color: var(--pico-primary-color, #fff);
      }
      .print-btn:hover {
        background-color: var(--pico-primary-hover-background, #004070);
      }
      .print-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="card">
        <div id="layoutGrid" class="layout-grid">
          <div class="left-column">
            <h1 id="pageHeading">Check In</h1>
            <p class="welcome" id="welcomeMessage">
              Welcome to the <b>Energy &amp; Utilities Data Connect</b> meetup!
            </p>

            <form id="checkInForm">
              <section>
                <label for="firstName">First Name</label>
                <input
                  type="text"
                  id="firstName"
                  name="firstName"
                  placeholder="Enter your first name"
                  required
                />
              </section>

              <section>
                <label for="lastName">Last Name</label>
                <input
                  type="text"
                  id="lastName"
                  name="lastName"
                  placeholder="Enter your last name"
                  required
                />
              </section>

              <section>
                <label for="company">Company</label>
                <input
                  type="text"
                  id="company"
                  name="company"
                  placeholder="Enter your company"
                  required
                />
              </section>

              <section>
                <label for="email">Work Email</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="your.email@company.com"
                  required
                />
              </section>

              <section>
                <label>
                  <input
                    type="checkbox"
                    id="contactPermission"
                    name="contactPermission"
                  />
                  Contact me about future updates and events!
                </label>
              </section>

              <button type="submit">Check In</button>
            </form>
          </div>

          <div class="right-column">
            <div class="name-tag-wrap" id="nameTagPreview">
              <div class="name-tag" aria-hidden="true">
                <div class="name-tag-left">
                  <div class="name-tag-group">
                    Energy &amp; Utilities Data Connect
                  </div>
                  <div class="name-tag-location">Sydney</div>
                </div>
                <hr class="name-tag-divider" />
                <div class="name-tag-name placeholder" id="nameTagName">
                  Your name
                </div>
                <hr class="name-tag-divider" />
                <div class="name-tag-company placeholder" id="nameTagCompany">
                  Company
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="confirmation-screen" id="confirmationScreen">
          <div class="confirmation-message">
            Thank you! Please pick up your name tag
          </div>
          <div class="confirmation-buttons">
            <button type="button" class="print-btn" id="printNameTagBtn">
              Print Name Tag
            </button>
            <button
              type="button"
              class="new-registration-btn"
              id="newRegistrationBtn"
            >
              New Check In
            </button>
          </div>
        </div>

        <div id="message" role="status" aria-live="polite"></div>
      </div>
    </main>

    <script>
      // Toggle testing mode to auto-fill form with test data
      const isTesting = true;

      // Check environment: auto-fill form with test data only in development
      // Controlled by URL parameter (?testMode=true) or environment variable
      const urlParams = new URLSearchParams(window.location.search);
      const isTestRun = isTesting || urlParams.get("testMode") === "true";

      // Front-end configuration for name tag display sizing
      const FONT_SIZE_CONFIG = {
        maxFontSize: 1.2, // rem
        minFontSize: 0.4, // rem
        maxLabelWidth: 70, // mm (80mm - padding)
        pixelsPerMm: 96 / 25.4, // 96 DPI standard
      };

      const firstNameInput = document.getElementById("firstName");
      const lastNameInput = document.getElementById("lastName");
      const companyInput = document.getElementById("company");
      const emailInput = document.getElementById("email");
      const nameTagName = document.getElementById("nameTagName");
      const nameTagCompany = document.getElementById("nameTagCompany");

      let isEmailAlreadyRegistered = false;

      // Test data for auto-fill when isTestRun is true
      const testFirstNames = [
        "Alex",
        "Sam",
        "Jordan",
        "Taylor",
        "Casey",
        "Morgan",
        "Riley",
        "Quinn",
      ];
      const testLastNames = [
        "Smith",
        "Chen",
        "Williams",
        "Nguyen",
        "Brown",
        "Garcia",
        "Lee",
        "Jones",
      ];
      const testCompanies = [
        "Acme Inc",
        "TechCorp",
        "DataFlow",
        "Energy Solutions",
        "CloudNine",
        "Nexus Labs",
        "One51",
        "Startup Co",
      ];

      function fillTestData() {
        const first =
          testFirstNames[Math.floor(Math.random() * testFirstNames.length)];
        const last =
          testLastNames[Math.floor(Math.random() * testLastNames.length)];
        const company =
          testCompanies[Math.floor(Math.random() * testCompanies.length)];
        const email = `${first.toLowerCase()}.${last.toLowerCase()}@${company.toLowerCase().replace(/\s/g, "")}.com`;
        firstNameInput.value = first;
        lastNameInput.value = last;
        companyInput.value = company;
        emailInput.value = email;
        document.getElementById("contactPermission").checked =
          Math.random() > 0.3;
        updateNameTag();
      }

      function updateNameTag() {
        const first = (firstNameInput.value || "").trim();
        const company = (companyInput.value || "").trim();

        if (first) {
          nameTagName.textContent = first.toUpperCase();
          nameTagName.classList.remove("placeholder");
          adjustNameFontSize();
        } else {
          nameTagName.textContent = "YOUR NAME";
          nameTagName.classList.add("placeholder");
          resetNameFontSize();
        }

        if (company) {
          nameTagCompany.textContent = company;
          nameTagCompany.classList.remove("placeholder");
        } else {
          nameTagCompany.textContent = "Company";
          nameTagCompany.classList.add("placeholder");
        }
      }

      function adjustNameFontSize() {
        const maxWidth = FONT_SIZE_CONFIG.maxLabelWidth;
        const minFontSize = FONT_SIZE_CONFIG.minFontSize;
        const maxFontSize = FONT_SIZE_CONFIG.maxFontSize;
        const nameElement = nameTagName;
        const text = nameElement.textContent;

        // Reset to max size first
        nameElement.style.fontSize = maxFontSize + "rem";

        // Get the width of the text at max font size
        const computedStyle = window.getComputedStyle(nameElement);
        const fontSize = parseFloat(computedStyle.fontSize);
        const textWidth = nameElement.scrollWidth;

        // Calculate available width in pixel equivalent
        const pxPerMm = FONT_SIZE_CONFIG.pixelsPerMm;
        const maxWidthPx = maxWidth * pxPerMm;

        // If text is too wide, reduce font size
        if (textWidth > maxWidthPx) {
          const scale = maxWidthPx / textWidth;
          const newFontSize = Math.max(minFontSize, maxFontSize * scale);
          nameElement.style.fontSize = newFontSize + "rem";
        } else {
          nameElement.style.fontSize = maxFontSize + "rem";
        }
      }

      function resetNameFontSize() {
        nameTagName.style.fontSize = FONT_SIZE_CONFIG.maxFontSize + "rem";
      }

      // Debounce function to reduce recalculations on rapid input
      function debounce(func, delay) {
        let timeoutId;
        return function () {
          clearTimeout(timeoutId);
          timeoutId = setTimeout(func, delay);
        };
      }

      // Debounced version of updateNameTag (300ms delay)
      const debouncedUpdateNameTag = debounce(updateNameTag, 300);

      firstNameInput.addEventListener("input", debouncedUpdateNameTag);
      companyInput.addEventListener("input", debouncedUpdateNameTag);

      if (isTestRun) {
        fillTestData();
      }

      let currentNameTagData = null;

      // Print name tag button handler
      document
        .getElementById("printNameTagBtn")
        .addEventListener("click", async () => {
          if (!currentNameTagData) {
            alert("No name tag data available to print.");
            return;
          }

          const printBtn = document.getElementById("printNameTagBtn");
          const originalText = printBtn.textContent;
          printBtn.disabled = true;
          printBtn.textContent = "Printing...";

          try {
            const response = await fetch("/api/print", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(currentNameTagData),
            });

            const result = await response.json();

            if (response.ok) {
              printBtn.textContent = "✓ Printed";
              setTimeout(() => {
                printBtn.textContent = originalText;
                printBtn.disabled = false;
              }, 2000);
            } else {
              alert("Print failed: " + (result.error || "Unknown error"));
              printBtn.textContent = originalText;
              printBtn.disabled = false;
            }
          } catch (error) {
            console.error("Print error:", error);
            alert("Failed to connect to printer. Please try again.");
            printBtn.textContent = originalText;
            printBtn.disabled = false;
          }
        });

      // New registration button handler
      document
        .getElementById("newRegistrationBtn")
        .addEventListener("click", () => {
          const layoutGrid = document.getElementById("layoutGrid");
          const confirmationScreen =
            document.getElementById("confirmationScreen");
          const messageDiv = document.getElementById("message");

          // Show grid, hide confirmation
          layoutGrid.classList.remove("hidden");
          confirmationScreen.classList.remove("active");

          messageDiv.style.display = "";
          messageDiv.textContent = "";
          messageDiv.className = "";

          currentNameTagData = null;
          firstNameInput.focus();
        });

      // Check In Form Submission
      document
        .getElementById("checkInForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const formData = new FormData(e.target);
          const data = Object.fromEntries(formData.entries());

          const messageDiv = document.getElementById("message");
          messageDiv.textContent = "Checking in...";
          messageDiv.className = "";

          try {
            const response = await fetch("/api/register", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(data),
            });

            const result = await response.json();

            if (response.ok) {
              const firstName = firstNameInput.value.trim();
              const company = companyInput.value.trim();
              currentNameTagData = {
                firstName: firstName,
                company: company,
                groupName: "Energy & Utilities Data Connect",
                location: "Sydney",
              };

              const layoutGrid = document.getElementById("layoutGrid");
              const confirmationScreen =
                document.getElementById("confirmationScreen");

              // Hide grid, show confirmation
              layoutGrid.classList.add("hidden");
              confirmationScreen.classList.add("active");
              messageDiv.style.display = "none";

              e.target.reset();
              updateNameTag();
            } else {
              messageDiv.textContent = result.error;
              messageDiv.className = "error";
            }
          } catch (error) {
            messageDiv.textContent =
              "A network error occurred. Please try again.";
            messageDiv.className = "error";
          }
        });
    </script>
  </body>
</html>
